<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <title>TaskManager — Kanban (DEADLINE alapú)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">

  <style>
    :root{ --bg:#f5f6fb; --ink:#1f1f1f; --muted:#60646c; --border:#e1e4ec; }
    *{box-sizing:border-box}
    body{ margin:0; width:100%; padding:24px 24px; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    header{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    h1{ font-size:22px; margin:0; }
    .btn{ padding:.45rem .8rem; border:1px solid #999; background:#fff; border-radius:.5rem; cursor:pointer; text-decoration:none; color:#000; display:inline-block; }
    .btn.danger{ border-color:#c33; }
    .inline{ display:inline-flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .muted{ color:var(--muted); font-size:.9rem; }

    /* BOARD */
    .board{
      display: grid;
      grid-template-columns: 35% 50% 15%;
      gap: 14px;
      align-items: start;
      width: 100%;
    }

    .col{
      background: #f7f9ff;
      border:1px solid var(--border); border-radius:12px; overflow:hidden;
      display:flex; flex-direction:column; min-height:420px;
      padding:10px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .col-title{
      font-weight:700;
      text-align:center;
      margin-bottom:10px;
      padding:10px;
      border-radius:10px;
      background:rgba(255,255,255,0.7);
      position:sticky;
      top:0;
      z-index:4;
    }

    .col[data-status="active"] .col-title{
      background:rgba(0,0,0,0.35);
      color:#fff;
    }

    .col-list{
      padding:12px; display:flex; flex-direction:column; gap:12px; flex:1;
      min-height: 360px;
    }

    .col[data-status="active"] > .col-list{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .col[data-status="coming"] > .col-list{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    /* CARD */
    .card{
      position:relative; padding:14px 12px 12px;
      border:1.5px solid rgba(0,0,0,.1); border-radius:10px;
      background:#fffbe6; box-shadow: 0 6px 14px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.06);
      transform: rotate(var(--rot,0deg));
      transition: box-shadow .12s ease;
      font-family:"Architects Daughter",cursive;
      cursor: grab;
      padding-top: 34px;
    }

    .card .title{
      font-size:1rem;
      font-weight:600;
      color:#1f1f1f;
      word-break:break-word;
      flex:1;
    }

    .card .actions{
      position:absolute; top:6px; right:6px; display:flex; gap:4px;
    }

    .card .actions .btn{
      padding:2px 6px;
      border-radius:4px;
      border:1px solid rgba(0,0,0,.2);
      background:#ffffffcc;
      cursor:pointer;
      font-size:0.7rem;
    }

    .card .actions .btn.danger{
      border-color:#c33;
      color:#c33;
    }

    /* DEADLINE STÍLUSOK */
    .card.deadline-today {
      border: 3px solid #ef4444 !important;
      box-shadow: 0 0 0 4px #fecaca, 0 8px 24px rgba(239, 68, 68, 0.3) !important;
      animation: pulse-deadline 1.5s ease-in-out infinite !important;
      background: #fef2f2 !important;
    }

    .card.deadline-overdue {
      border: 3px solid #dc2626 !important;
      box-shadow: 0 0 0 4px #fca5a5, 0 8px 24px rgba(220, 38, 38, 0.3) !important;
      background: #fee2e2 !important;
      opacity: 0.85 !important;
    }

    .card.deadline-soon {
      border: 2px solid #f59e0b !important;
      box-shadow: 0 0 0 3px #fde68a, 0 8px 20px rgba(245, 158, 11, 0.2) !important;
      background: #fffbeb !important;
    }

    @keyframes pulse-deadline {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); box-shadow: 0 0 0 8px #fca5a5, 0 8px 30px rgba(239, 68, 68, 0.4); }
    }

    .deadline-display {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 6px 12px !important;
      border-radius: 8px !important;
      margin: 6px 0 4px 0 !important;
      flex-wrap: wrap !important;
      font-weight: 600 !important;
    }

    /* FORM */
    #formSection{ margin-top:10px; }
    form{ display:grid; gap:.6rem; }
    label{ display:grid; gap:.25rem; }
    .row{ display:grid; gap:.6rem; grid-template-columns:repeat(4,minmax(0,1fr)); }
    input,textarea{ padding:.55rem .7rem; border:1px solid var(--border); border-radius:.5rem; background:#fff; }
    textarea{ resize:vertical; min-height:84px; }

    @media (max-width:900px){
      .board{ grid-template-columns: 1fr 1fr; }
    }
    @media (max-width:600px){
      .board{ grid-template-columns: 1fr; }
      .row{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:520px){ .row{ grid-template-columns:1fr; } }

    /* CSV Modal */
    #csvModal{ display:none; position:fixed; inset:0; background:#0008; z-index:999; align-items:center; justify-content:center; }
    #csvModal .modal-content{ background:#fff; padding:20px; border-radius:8px; max-width:800px; width:90%; max-height:80%; overflow:auto; }
  </style>
</head>
<body>
  <header>
    <h1>📋 TaskManager</h1>
    <div class="inline">
      <button id="newBtn" class="btn">➕ New</button>
      <button id="reportBtn" class="btn">📊 Report</button>
      <button id="toggleCalBtn" class="btn">📅 Calendar</button>
      <a href="/project.html" class="btn">📊 Project</a>
      <a href="/wiki.html" class="btn">🧠 Wiki</a>
      <a href="/doc.html" class="btn">📁 Docs</a>
    </div>
  </header>

  <section id="calendarSection" hidden>
    <iframe id="gcalFrame" width="100%" height="400" frameborder="0" scrolling="no"></iframe>
  </section>

  <section id="listSection">
    <div class="board" id="board">
      <div class="col" data-status="coming">
        <div class="col-title">📥 BACKLOG</div>
        <div class="col-list" id="col-coming"></div>
      </div>
      <div class="col" data-status="active">
        <div class="col-title">⚡ ACTIVE</div>
        <div class="col-list" id="col-active"></div>
      </div>
      <div class="col" data-status="tracking">
        <div class="col-title">⏱️ TRACKING</div>
        <div class="col-list" id="col-tracking"></div>
      </div>
    </div>
  </section>

  <section id="formSection" hidden>
    <h2 id="formTitle">New Task</h2>
    <form id="taskForm">
      <input type="hidden" name="id" />
      <label>Title <input required name="title" placeholder="Task title" /></label>
      <label>Tag <input name="tag" placeholder="Work / Personal / Urgent" /></label>
      <label>Wiki reference
        <select name="wikiRef" id="wikiRefSelect">
          <option value="">— none —</option>
        </select>
      </label>
      <label>Sprint
        <select name="sprintId" id="sprintSelect">
          <option value="">— none —</option>
        </select>
      </label>
      <label>Deadline (határidő)
        <input type="date" name="deadline" />
        <span class="muted">Ha a határidő ma van vagy lejárt → ACTIVE</span>
      </label>
      <label>Notes <textarea name="notes" rows="4" placeholder="Jegyzet..."></textarea></label>
      <label>Working hours <input type="number" name="trackedHours" step="0.01" min="0" placeholder="pl. 1.5" /></label>
      <label>Timesheet <textarea name="timeLog" rows="3" placeholder="Időnapló..."></textarea></label>
      <label class="inline"><input type="checkbox" name="done" /> Done</label>
      <div class="inline">
        <button class="btn" type="submit">💾 Save</button>
        <button class="btn" type="button" id="cancelBtn">❌ Cancel</button>
      </div>
    </form>
  </section>

  <div id="csvModal">
    <div class="modal-content">
      <h3>📊 Monthly Report (CSV)</h3>
      <pre id="csvContent" style="white-space:pre-wrap;font-family:monospace;max-height:400px;overflow:auto;"></pre>
      <button onclick="document.getElementById('csvModal').style.display='none'" class="btn">Close</button>
    </div>
  </div>

  <!-- 🔥 Fontos: a JS fájlok betöltése -->
  <script src="/app.js"></script>
</body>
</html>
