<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <title>Sprint Management — TaskManager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style-sprint.css" />
</head>
<body>

  <!-- Navigáció -->
  <nav class="nav-bar">
    <a href="/">🏠 Home</a>
    <a href="/index.html">📋 Board</a>
    <a href="/project.html">📊 Projects</a>
    <a href="/sprints.html" class="active">📅 Sprints</a>
    <a href="/wiki.html">📚 Wiki</a>
    <a href="/doc.html">📁 Documents</a>
  </nav>

  <!-- Eszköztár -->
  <div class="toolbar">
    <div class="toolbar-header">
      <h1>📅 Sprint Management</h1>
      <div class="toolbar-actions">
        <button id="newSprintBtn" class="btn primary">+ New Sprint</button>
      </div>
    </div>
  </div>

  <!-- Sprint lista -->
  <div id="sprintList" class="sprint-list">
    <div class="loading">Loading sprints...</div>
  </div>

  <!-- Modal: Sprint szerkesztés -->
  <div id="sprintModal" class="modal" style="display:none">
    <div class="modal-content">
      <h2 id="sprintModalTitle">➕ New Sprint</h2>
      <form id="sprintForm">
        <label>
          Sprint name *
          <input type="text" id="sprintName" required placeholder="e.g. Sprint 23" />
        </label>
        <div class="row">
          <label>
            Start date
            <input type="date" id="sprintStartDate" />
          </label>
          <label>
            End date
            <input type="date" id="sprintEndDate" />
          </label>
        </div>
        <label>
          Goal
          <input type="text" id="sprintGoal" placeholder="Sprint goal..." />
        </label>
        <label>
          Status
          <select id="sprintStatus">
            <option value="upcoming">🔵 Upcoming</option>
            <option value="active">🟢 Active</option>
            <option value="completed">⚪ Completed</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn primary">Save</button>
          <button type="button" class="btn" id="closeSprintModalBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/sprint.js"></script>
</body>
</html>
